<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORDI GYM TTW</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .notif-bar {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px dashed var(--primary);
            color: var(--primary);
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .exercise-block {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .exercise-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--primary);
        }

        .target-reps-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .target-reps-container label {
            font-size: 0.75rem;
            margin-bottom: 0;
            color: var(--text-muted);
        }

        .target-reps-input {
            width: 75px !important;
            padding: 4px 6px !important;
            font-size: 0.85rem !important;
            text-align: center;
            background-color: var(--card-bg) !important;
        }

        .set-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 2fr 45px;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px;
            border-radius: 6px;
        }

        .set-row label {
            margin-bottom: 0;
            font-weight: bold;
            color: var(--text-main);
            text-align: center;
        }

        .set-row input[type="number"] {
            padding: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        .set-row input.note-input {
            text-align: left;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 8px;
        }

        .btn-check {
            background-color: var(--border);
            color: var(--text-muted);
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-check.completed {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
        }

        .btn-add-set {
            background-color: transparent;
            border: 1px dashed var(--primary);
            color: var(--primary);
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add-set:hover {
            background-color: rgba(34, 197, 94, 0.1);
        }

        button.main-btn {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button.main-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Timer de descans flotant */
        #timer-container {
            position: fixed;
            bottom: 60px;
            left: 15px;
            right: 15px;
            background-color: #1e293b;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
            max-width: 570px;
            margin: 0 auto;
        }

        #timer-display {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 5px 0;
        }

        .timer-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .timer-btns button {
            background-color: var(--border);
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .timer-btns button.active-time {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
        }

        /* Navegació Inferior */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        nav button {
            background: none;
            color: var(--text-muted);
            border: none;
            font-size: 0.8rem;
            margin: 0;
            padding: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        nav button.active {
            color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .history-item {
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>JORDI GYM TTW</h1>
        <p>El teu Diari d'Entrenament Professional</p>
    </header>

    <!-- Botó explícit per activar permisos d'àudio i notificacions a iOS/Android -->
    <div class="notif-bar" id="permission-bar" onclick="requestAppPermissions()">
        🔔 Clica aquí per activar So i Avisos en segon pla
    </div>

    <!-- PESTANYA 1: ENTRENAMENT -->
    <div id="tab-workout" class="tab-content active">
        <div class="card">
            <h2>🏋️ Selecciona Sessió</h2>
            <div class="form-group">
                <label for="session-select">Tipus de Rutina</label>
                <select id="session-select" onchange="renderWorkoutSession()">
                    <option value="royalcama">CAMES Royal</option>
                    <option value="royalpress">PRESS Royal</option>
                    <option value="royalpit">PIT Royal</option>
                    <option value="push">Sessió Push (Pit, Espatlla, Tríceps)</option>
                    <option value="pull">Sessió Pull (Esquena, Bíceps)</option>
                    <option value="legs">Sessió Cames (Quàdriceps, Isquis, Cama)</option>
                    <option value="torso">Sessió Torso (Bàsics Pit/Esquena)</option>
                    <option value="fullbody">Sessió Full Body (Global)</option>
                </select>
            </div>
        </div>

        <!-- CONTENIDOR D'EXERCICIS EN CASCADA -->
        <div id="exercises-container"></div>

        <button class="main-btn" onclick="saveWorkoutSession()">Finalitzar i Guardar Sessió 💾</button>
    </div>

    <!-- TEMPORITZADOR DE DESCANS FLOTANT -->
    <div id="timer-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size: 0.85rem; color: var(--text-muted);">⏱️ Temps de Descans</span>
            <button onclick="stopTimer()" style="background:none; border:none; color:var(--danger); font-size:1rem; cursor:pointer; width:auto; padding:0;">✕ Tancar</button>
        </div>
        <div id="timer-display">01:30</div>
        <div class="timer-btns">
            <button onclick="setRestTime(60)" id="btn-60">60s</button>
            <button onclick="setRestTime(90)" id="btn-90" class="active-time">90s</button>
            <button onclick="setRestTime(120)" id="btn-120">120s</button>
            <button onclick="setRestTime(180)" id="btn-180">180s</button>
            <button onclick="addTime(-15)">-15s</button>
            <button onclick="addTime(-30)">-30s</button>
            <button onclick="addTime(15)">+15s</button>
        </div>
    </div>

    <!-- PESTANYA 2: HISTORIAL -->
    <div id="tab-history" class="tab-content">
        <div class="card">
            <h2>📋 Historial d'Entrenaments</h2>
            <div id="history-list">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Encara no hi ha registres.</p>
            </div>
        </div>
    </div>

    <!-- PESTANYA 3: ESTADÍSTIQUES -->
    <div id="tab-stats" class="tab-content">
        <div class="card">
            <h2>📊 Progrés</h2>
            <canvas id="progressChart"></canvas>
        </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓ -->
    <nav>
        <button onclick="switchTab('workout')" id="nav-workout" class="active">💪 Entrenament</button>
        <button onclick="switchTab('history')" id="nav-history">📋 Historial</button>
        <button onclick="switchTab('stats')" id="nav-stats">📊 Estadístiques</button>
    </nav>

    <script>
        const sessionData = {
            royalpit: [
                { name: "1. Press Banca ", defaultTarget: "8-10" },
                { name: "2. Press Inclinat", defaultTarget: "10-12" },
                { name: "3. Creuament politges superior", defaultTarget: "12-15" },
                { name: "4. Extensió Tríceps", defaultTarget: "12-15" },
                { name: "5. Elevacions Laterals", defaultTarget: "12-15" }
            ],
            royalcama: [
                { name: "1. Sentadilla Cinturo / Sentadilla barra fixa", defaultTarget: "8-10" },
                { name: "2. Búlgares", defaultTarget: "10-12" },
                { name: "3. Femoral Sentat", defaultTarget: "12-15" },
                { name: "4. Hak", defaultTarget: "10-12" },
                { name: "5. Adductors", defaultTarget: "12-15" }
            ],
            royalpress: [
                { name: "1. Elevació Barra gran (hombros)", defaultTarget: "8-10" },
                { name: "2. Press Manuelles", defaultTarget: "10-12" },
                { name: "3. Rem una mà", defaultTarget: "10-12" },
                { name: "4. Tracció pit barra ampla", defaultTarget: "10-12" },
                { name: "5. Elevacions Laterals", defaultTarget: "12-15" }
            ],
            push: [
                { name: "1. Press de Banca", defaultTarget: "8-10" },
                { name: "2. Press Inclinat amb Mancornes", defaultTarget: "10-12" },
                { name: "3. Obertures en Pollea / Pit", defaultTarget: "12-15" },
                { name: "4. Extensions de Tríceps", defaultTarget: "12-15" }
            ],
            pull: [
                { name: "1. Dominades o Jaló al Pit", defaultTarget: "8-10" },
                { name: "2. Rem en Pollea Baixa", defaultTarget: "10-12" },
                { name: "3. Rem amb Mancorna a una mà", defaultTarget: "10-12" },
                { name: "4. Curl de Bíceps amb Barra", defaultTarget: "12-15" }
            ],
            legs: [
                { name: "1. Esquat Lliure o Multipower", defaultTarget: "8-10" },
                { name: "2. Prensa de Cames 45º", defaultTarget: "10-12" },
                { name: "3. Extensions de Quàdriceps", defaultTarget: "12-15" },
                { name: "4. Curl Isquiotibials", defaultTarget: "12-15" }
            ],
            torso: [
                { name: "1. Press de Banca", defaultTarget: "8-10" },
                { name: "2. Rem en Pollea Baixa", defaultTarget: "8-10" },
                { name: "3. Press Militar d'Espatlla", defaultTarget: "10-12" },
                { name: "4. Jaló al Pit", defaultTarget: "10-12" }
            ],
            fullbody: [
                { name: "1. Esquat Lliure", defaultTarget: "8-10" },
                { name: "2. Press de Banca", defaultTarget: "8-10" },
                { name: "3. Rem en Pollea Baixa", defaultTarget: "10-12" },
                { name: "4. Planxa Abdominal", defaultTarget: "30s" }
            ]
        };

        let exerciseSetsCount = {};
        let workoutState = {};

        let audioCtx = null;
        let silentOscillator = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startKeepAliveAudio() {
            initAudio();
            if (!audioCtx) return;
            try {
                if (silentOscillator) {
                    silentOscillator.stop();
                }
                silentOscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.00001, audioCtx.currentTime);
                silentOscillator.connect(gain);
                gain.connect(audioCtx.destination);
                silentOscillator.start();
            } catch(e) {}
        }

        // Funció que s'activa en clicar el botó superior
        function requestAppPermissions() {
            initAudio();
            startKeepAliveAudio();
            
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    const bar = document.getElementById('permission-bar');
                    if (permission === "granted") {
                        bar.style.backgroundColor = "rgba(34, 197, 94, 0.3)";
                        bar.textContent = "✅ So i Avisos Activats Correctament!";
                    } else {
                        bar.textContent = "⚠️ Has denegat els permisos de notificació.";
                    }
                });
            } else {
                alert("El teu navegador no suporta notificacions en segon pla, però l'àudio funcionarà.");
            }
        }

        function playAppleStyleTone() {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.50, now); 
            gain1.gain.setValueAtTime(0.5, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.15); 
            gain2.gain.setValueAtTime(0.6, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.6);
        }

        function triggerNativeNotification() {
            playAppleStyleTone();
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification("JORDI GYM TTW", {
                        body: "⏰ Temps de descans finalitzat! A per la següent sèrie.",
                        tag: "gym-timer",
                        renotify: true
                    });
                } catch (err) {
                    console.log("Error al llançar notificació", err);
                }
            }
        }

        function saveCurrentInputsToState() {
            const sessionKey = document.getElementById('session-select').value;
            if (!workoutState[sessionKey]) workoutState[sessionKey] = {};

            const exercises = sessionData[sessionKey];
            exercises.forEach((ex, exIndex) => {
                let totalSets = exerciseSetsCount[sessionKey] ? exerciseSetsCount[sessionKey][exIndex] : 3;
                
                let targetElem = document.getElementById(`target_${exIndex}`);
                if(targetElem) {
                    workoutState[sessionKey][`target_${exIndex}`] = targetElem.value;
                }

                for(let s = 1; s <= totalSets; s++) {
                    let wElem = document.getElementById(`w_${exIndex}_${s}`);
                    let rElem = document.getElementById(`r_${exIndex}_${s}`);
                    let nElem = document.getElementById(`n_${exIndex}_${s}`);
                    let btnElem = document.getElementById(`btn_${exIndex}_${s}`);

                    if(wElem || rElem || nElem) {
                        workoutState[sessionKey][`${exIndex}_${s}`] = {
                            w: wElem ? wElem.value : '',
                            r: rElem ? rElem.value : '',
                            n: nElem ? nElem.value : '',
                            completed: btnElem ? btnElem.classList.contains('completed') : false
                        };
                    }
                }
            });
        }

        function renderWorkoutSession() {
            saveCurrentInputsToState();

            const sessionKey = document.getElementById('session-select').value;
            const container = document.getElementById('exercises-container');
            const exercises = sessionData[sessionKey];

            if(!exerciseSetsCount[sessionKey]) {
                exerciseSetsCount[sessionKey] = exercises.map(() => 3);
            }

            let html = '';
            exercises.forEach((ex, exIndex) => {
                let totalSets = exerciseSetsCount[sessionKey][exIndex];
                
                let savedTarget = (workoutState[sessionKey] && workoutState[sessionKey][`target_${exIndex}`]) 
                    ? workoutState[sessionKey][`target_${exIndex}`] 
                    : ex.defaultTarget;
                
                html += `
                    <div class="exercise-block">
                        <div class="exercise-header">
                            <div class="exercise-title">${ex.name}</div>
                            <div class="target-reps-container">
                                <label>Obj:</label>
                                <input type="text" class="target-reps-input" id="target_${exIndex}" value="${savedTarget}" placeholder="Reps">
                            </div>
                        </div>
                        <div id="sets-container_${exIndex}">
                `;

                for(let s = 1; s <= totalSets; s++) {
                    let savedData = (workoutState[sessionKey] && workoutState[sessionKey][`${exIndex}_${s}`]) ? workoutState[sessionKey][`${exIndex}_${s}`] : {w:'', r:'', n:'', completed:false};
                    
                    html += `
                        <div class="set-row" id="row_${exIndex}_${s}">
                            <label>S${s}</label>
                            <input type="number" step="0.5" placeholder="Kg" id="w_${exIndex}_${s}" value="${savedData.w}">
                            <input type="number" placeholder="Reps" id="r_${exIndex}_${s}" value="${savedData.r}">
                            <input type="text" class="note-input" placeholder="Notes..." id="n_${exIndex}_${s}" value="${savedData.n}">
                            <button type="button" class="btn-check ${savedData.completed ? 'completed' : ''}" id="btn_${exIndex}_${s}" onclick="completeSet(${exIndex}, ${s})">✓</button>
                        </div>
                    `;
                }

                html += `
                        </div>
                        <button type="button" class="btn-add-set" onclick="addSet(${exIndex})">+ Afegir sèrie</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function addSet(exIndex) {
            saveCurrentInputsToState();
            const sessionKey = document.getElementById('session-select').value;
            exerciseSetsCount[sessionKey][exIndex]++;
            renderWorkoutSession();
        }

        let currentSelectedSeconds = 90;

        function completeSet(exIndex, setNum) {
            initAudio(); 
            startKeepAliveAudio();
            const btn = document.getElementById(`btn_${exIndex}_${setNum}`);
            btn.classList.toggle('completed');
            
            if(btn.classList.contains('completed')) {
                startTimer(currentSelectedSeconds);
            }
        }

        let timerInterval;
        let targetEndTime = null;

        function startTimer(seconds) {
            clearInterval(timerInterval);
            initAudio();
            startKeepAliveAudio();
            
            targetEndTime = Date.now() + (seconds * 1000);
            document.getElementById('timer-container').style.display = 'block';
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                const now = Date.now();
                const remainingMs = targetEndTime - now;

                if (remainingMs <= 0) {
                    clearInterval(timerInterval);
                    updateTimerDisplay(0);
                    triggerNativeNotification();
                    stopTimer();
                } else {
                    updateTimerDisplay(Math.ceil(remainingMs / 1000));
                }
            }, 500);
        }

        function setRestTime(seconds) {
            currentSelectedSeconds = seconds;
            [60, 90, 120, 180].forEach(s => {
                const b = document.getElementById(`btn-${s}`);
                if(b) b.classList.remove('active-time');
            });
            const activeBtn = document.getElementById(`btn-${seconds}`);
            if(activeBtn) activeBtn.classList.add('active-time');

            startTimer(seconds);
        }

        function addTime(seconds) {
            if (targetEndTime) {
                targetEndTime += (seconds * 1000);
                const remainingMs = Math.max(0, targetEndTime - Date.now());
                updateTimerDisplay(Math.ceil(remainingMs / 1000));
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            targetEndTime = null;
            document.getElementById('timer-container').style.display = 'none';
        }

        function updateTimerDisplay(overrideSeconds) {
            let secondsLeft = overrideSeconds;
            if (secondsLeft === undefined) {
                secondsLeft = targetEndTime ? Math.max(0, Math.ceil((targetEndTime - Date.now()) / 1000)) : 0;
            }
            let mins = Math.floor(secondsLeft / 60);
            let secs = secondsLeft % 60;
            document.getElementById('timer-display').textContent = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        let historyData = JSON.parse(localStorage.getItem('gym_history')) || [];

        function saveWorkoutSession() {
            saveCurrentInputsToState();
            const sessionKey = document.getElementById('session-select').value;
            const sessionType = sessionKey.toUpperCase();
            const exercises = sessionData[sessionKey];
            const setsCountArr = exerciseSetsCount[sessionKey] || exercises.map(() => 3);
            
            let summarySets = [];
            exercises.forEach((ex, exIndex) => {
                let totalSets = setsCountArr[exIndex];
                let targetRep = document.getElementById(`target_${exIndex}`) ? document.getElementById(`target_${exIndex}`).value : ex.defaultTarget;
                
                for(let s = 1; s <= totalSets; s++) {
                    let saved = workoutState[sessionKey] ? workoutState[sessionKey][`${exIndex}_${s}`] : null;
                    if(saved && (saved.w || saved.r || saved.n)) {
                        summarySets.push(`${ex.name} [Obj: ${targetRep}] (S${s}): ${saved.w ? saved.w+'kg' : '-'} × ${saved.r ? saved.r+'reps' : '-'} ${saved.n ? '['+saved.n+']' : ''}`);
                    }
                }
            });

            if(summarySets.length === 0) {
                alert('No hi ha cap dada introduïda per desar.');
                return;
            }

            const record = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                sessionType,
                details: summarySets
            };

            historyData.unshift(record);
            localStorage.setItem('gym_history', JSON.stringify(historyData));
            updateHistoryUI();
            alert('🎉 Sessió desada correctament a l\'historial!');
            switchTab('history');
        }

        function updateHistoryUI() {
            const container = document.getElementById('history-list');
            if(historyData.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Encara no hi ha registres.</p>';
                return;
            }

            container.innerHTML = historyData.slice(0, 10).map(item => `
                <div class="history-item">
                    <strong style="color: var(--primary);">[${item.sessionType}]</strong> <span style="font-size:0.75rem; color:var(--text-muted);">${item.date}</span><br>
                    <div style="margin-top: 5px; font-size: 0.85rem; color: #cbd5e1;">
                        ${item.details.map(d => `• ${d}`).join('<br>')}
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        renderWorkoutSession();
        updateHistoryUI();
    </script>
</body>
</html>
