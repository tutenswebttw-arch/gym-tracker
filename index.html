<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Pro Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Timer de descans */
        #timer-container {
            text-align: center;
            display: none;
        }

        #timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

        .timer-btns {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .timer-btns button {
            background-color: var(--border);
            color: var(--text-main);
            padding: 8px;
            font-size: 0.85rem;
        }

        /* Navegació Inferior */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        nav button {
            background: none;
            color: var(--text-muted);
            border: none;
            font-size: 0.8rem;
            margin: 0;
            padding: 5px;
            font-weight: normal;
        }

        nav button.active {
            color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .history-item {
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>GYM PRO TRACKER</h1>
        <p>Entrenament efectiu: 3 Sèries (10-15 Reps)</p>
    </header>

    <!-- PESTANYA 1: ENTRENAMENT -->
    <div id="tab-workout" class="tab-content active">
        <div class="card">
            <h2>💪 Registrar Sèrie</h2>
            <div class="form-group">
                <label for="exercise-select">Selecciona Exercici (4 per grup)</label>
                <select id="exercise-select">
                    <optgroup label="Pit (3 Sèries | 10-15 Reps)">
                        <option value="Press de Banca">1. Press de Banca</option>
                        <option value="Press Inclinat amb Mancornes">2. Press Inclinat amb Mancornes</option>
                        <option value="Obertures en Pollea">3. Obertures en Pollea</option>
                        <option value="Fons en Paral·leles">4. Fons en Paral·leles</option>
                    </optgroup>
                    <optgroup label="Esquena (3 Sèries | 10-15 Reps)">
                        <option value="Dominades o Jaló al Pit">1. Dominades o Jaló al Pit</option>
                        <option value="Rem en Pollea Baixa">2. Rem en Pollea Baixa</option>
                        <option value="Rem amb Mancona a una mà">3. Rem amb Mancona a una mà</option>
                        <option value="Pull-over en Pollea">4. Pull-over en Pollea</option>
                    </optgroup>
                    <optgroup label="Cames (3 Sèries | 10-15 Reps)">
                        <option value="Esquat Lliure">1. Esquat Lliure</option>
                        <option value="Prensa de Cames 45º">2. Prensa de Cames 45º</option>
                        <option value="Extensions de Quàdriceps">3. Extensions de Quàdriceps</option>
                        <option value="Curl Isquiotibials">4. Curl Isquiotibials</option>
                    </optgroup>
                </select>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="set-num">Sèrie (1-3)</label>
                    <input type="number" id="set-num" min="1" max="3" value="1">
                </div>
                <div class="form-group">
                    <label for="weight-input">Pes (kg)</label>
                    <input type="number" id="weight-input" step="0.5" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="reps-input">Reps (10-15)</label>
                    <input type="number" id="reps-input" min="1" max="50" value="12">
                </div>
            </div>

            <button onclick="logSet()">Guardar Sèrie i Descansar</button>
        </div>

        <!-- TEMPORITZADOR DE DESCRANS -->
        <div class="card" id="timer-container">
            <h2>⏱️ Temps de Descans</h2>
            <div id="timer-display">01:30</div>
            <div class="timer-btns">
                <button onclick="addTime(-30)">-30s</button>
                <button onclick="setRestTime(60)">60s</button>
                <button onclick="setRestTime(90)">90s</button>
                <button onclick="setRestTime(120)">120s</button>
                <button onclick="addTime(30)">+30s</button>
            </div>
            <button onclick="stopTimer()" style="background-color: var(--danger); color: #fff;">Saltar Descans</button>
        </div>
    </div>

    <!-- PESTANYA 2: HISTORIAL -->
    <div id="tab-history" class="tab-content">
        <div class="card">
            <h2>📋 Historial d'Entrenaments</h2>
            <div id="history-list">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Encara no hi ha registres avui.</p>
            </div>
        </div>
    </div>

    <!-- PESTANYA 3: ESTADÍSTIQUES -->
    <div id="tab-stats" class="tab-content">
        <div class="card">
            <h2>📊 Progrés</h2>
            <canvas id="progressChart"></canvas>
        </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓ -->
    <nav>
        <button onclick="switchTab('workout')" id="nav-workout" class="active">💪 Entrenament</button>
        <button onclick="switchTab('history')" id="nav-history">📋 Historial</button>
        <button onclick="switchTab('stats')" id="nav-stats">📊 Estadístiques</button>
    </nav>

    <script>
        // Gestió de Pestanyes
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        // Lògica de Registre i Emmagatzematge Local
        let historyData = JSON.parse(localStorage.getItem('gym_history')) || [];

        function logSet() {
            const exercise = document.getElementById('exercise-select').value;
            const set = document.getElementById('set-num').value;
            const weight = document.getElementById('weight-input').value;
            const reps = document.getElementById('reps-input').value;

            if(!weight || !reps) {
                alert('Si us plau, introdueix el pes i les repeticions.');
                return;
            }

            const record = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                exercise,
                set,
                weight,
                reps
            };

            historyData.unshift(record);
            localStorage.setItem('gym_history', JSON.stringify(historyData));
            updateHistoryUI();

            // Incrementar automàticament el número de sèrie fins a 3
            let nextSet = parseInt(set) + 1;
            if(nextSet <= 3) {
                document.getElementById('set-num').value = nextSet;
            }

            startTimer(90); // Activar descans de 90 segons per defecte
        }

        function updateHistoryUI() {
            const container = document.getElementById('history-list');
            if(historyData.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Encara no hi ha registres avui.</p>';
                return;
            }

            container.innerHTML = historyData.slice(0, 15).map(item => `
                <div class="history-item">
                    <strong>${item.exercise}</strong> (Sèrie ${item.set})<br>
                    <span style="color: var(--primary);">${item.weight} kg</span> × ${item.reps} reps 
                    <span style="float: right; font-size: 0.75rem; color: var(--text-muted);">${item.date}</span>
                </div>
            `).join('');
        }

        // Temporitzador
        let timerInterval;
        let timeLeft = 90;

        function startTimer(seconds) {
            clearInterval(timerInterval);
            timeLeft = seconds;
            document.getElementById('timer-container').style.display = 'block';
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('⏰ Temps de descans finalitzat! A per la següent sèrie.');
                    stopTimer();
                }
            }, 1000);
        }

        function setRestTime(seconds) {
            startTimer(seconds);
        }

        function addTime(seconds) {
            timeLeft = Math.max(0, timeLeft + seconds);
            updateTimerDisplay();
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-container').style.display = 'none';
        }

        function updateTimerDisplay() {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer-display').textContent = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        // Inicialitzar dades en carregar
        updateHistoryUI();
    </script>
</body>
</html>
