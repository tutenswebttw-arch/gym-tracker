<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym JORDI TTW</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Estils per als exercicis en cascada */
        .exercise-block {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .exercise-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .set-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 2fr 45px;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px;
            border-radius: 6px;
        }

        .set-row label {
            margin-bottom: 0;
            font-weight: bold;
            color: var(--text-main);
            text-align: center;
        }

        .set-row input[type="number"] {
            padding: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        .set-row input.note-input {
            text-align: left;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 8px;
        }

        .btn-check {
            background-color: var(--border);
            color: var(--text-muted);
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-check.completed {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
        }

        .btn-add-set {
            background-color: transparent;
            border: 1px dashed var(--primary);
            color: var(--primary);
            width: 100%;
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: bold;
        }

        .btn-add-set:hover {
            background-color: rgba(34, 197, 94, 0.1);
        }

        button.main-btn {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button.main-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Timer de descans flotant amb àudio */
        #timer-container {
            position: fixed;
            bottom: 60px;
            left: 15px;
            right: 15px;
            background-color: #1e293b;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
            max-width: 570px;
            margin: 0 auto;
        }

        #timer-display {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 5px 0;
        }

        .timer-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .timer-btns button {
            background-color: var(--border);
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .timer-btns button.active-time {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
        }

        /* Navegació Inferior */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        nav button {
            background: none;
            color: var(--text-muted);
            border: none;
            font-size: 0.8rem;
            margin: 0;
            padding: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        nav button.active {
            color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .history-item {
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>GYM PRO TRACKER</h1>
        <p>Control Total de Sèries i Descassos</p>
    </header>

    <!-- PESTANYA 1: ENTRENAMENT -->
    <div id="tab-workout" class="tab-content active">
        <div class="card">
            <h2>🏋️ Selecciona Sessió</h2>
            <div class="form-group">
                <label for="session-select">Tipus de Rutina</label>
                <select id="session-select" onchange="renderWorkoutSession()">
                    <option value="push">Sessió Push (Pit, Espatlla, Tríceps)</option>
                    <option value="pull">Sessió Pull (Esquena, Bíceps)</option>
                    <option value="legs">Sessió Cames (Quàdriceps, Isquis, Cama)</option>
                </select>
            </div>
        </div>

        <!-- CONTENIDOR D'EXERCICIS EN CASCADA -->
        <div id="exercises-container"></div>

        <button class="main-btn" onclick="saveWorkoutSession()">Finalitzar i Guardar Sessió 💾</button>
    </div>

    <!-- TEMPORITZADOR DE DESCANS FLOTANT -->
    <div id="timer-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size: 0.85rem; color: var(--text-muted);">⏱️ Temps de Descans</span>
            <button onclick="stopTimer()" style="background:none; border:none; color:var(--danger); font-size:1rem; cursor:pointer; width:auto; padding:0;">✕ Tancar</button>
        </div>
        <div id="timer-display">01:00</div>
        <div class="timer-btns">
            <button onclick="setRestTime(60)" id="btn-60" class="active-time">60s</button>
            <button onclick="setRestTime(120)" id="btn-120">120s</button>
            <button onclick="setRestTime(180)" id="btn-180">180s</button>
            <button onclick="addTime(-15)">-15s</button>
            <button onclick="addTime(15)">+15s</button>
        </div>
    </div>

    <!-- PESTANYA 2: HISTORIAL -->
    <div id="tab-history" class="tab-content">
        <div class="card">
            <h2>📋 Historial d'Entrenaments</h2>
            <div id="history-list">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Encara no hi ha registres.</p>
            </div>
        </div>
    </div>

    <!-- PESTANYA 3: ESTADÍSTIQUES -->
    <div id="tab-stats" class="tab-content">
        <div class="card">
            <h2>📊 Progrés</h2>
            <canvas id="progressChart"></canvas>
        </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓ -->
    <nav>
        <button onclick="switchTab('workout')" id="nav-workout" class="active">💪 Entrenament</button>
        <button onclick="switchTab('history')" id="nav-history">📋 Historial</button>
        <button onclick="switchTab('stats')" id="nav-stats">📊 Estadístiques</button>
    </nav>

    <script>
        // Definició de les 3 sessions amb els seus 4 exercicis base
        const sessionData = {
            push: [
                "1. Press de Banca",
                "2. Press Inclinat amb Mancornes",
                "3. Obertures en Pollea / Pit",
                "4. Extensions de Tríceps"
            ],
            pull: [
                "1. Dominades o Jaló al Pit",
                "2. Rem en Pollea Baixa",
                "3. Rem amb Mancorna a una mà",
                "4. Curl de Bíceps amb Barra"
            ],
            legs: [
                "1. Esquat Lliure o Multipower",
                "2. Prensa de Cames 45º",
                "3. Extensions de Quàdriceps",
                "4. Curl Isquiotibials"
            ]
        };

        // Emmagatzematge temporal del nombre de sèries per cada exercici de la sessió actual
        let exerciseSetsCount = {};

        function renderWorkoutSession() {
            const sessionKey = document.getElementById('session-select').value;
            const container = document.getElementById('exercises-container');
            const exercises = sessionData[sessionKey];

            // Inicialitzar a 3 sèries per defecte per a cada exercici si no existeixen
            if(!exerciseSetsCount[sessionKey]) {
                exerciseSetsCount[sessionKey] = [3, 3, 3, 3];
            }

            let html = '';
            exercises.forEach((exName, exIndex) => {
                let totalSets = exerciseSetsCount[sessionKey][exIndex];
                
                html += `
                    <div class="exercise-block">
                        <div class="exercise-title">${exName}</div>
                        <div id="sets-container_${exIndex}">
                `;

                // Dibuixar les sèries
                for(let s = 1; s <= totalSets; s++) {
                    html += `
                        <div class="set-row" id="row_${exIndex}_${s}">
                            <label>S${s}</label>
                            <input type="number" step="0.5" placeholder="Kg" id="w_${exIndex}_${s}">
                            <input type="number" placeholder="Reps" id="r_${exIndex}_${s}" value="12">
                            <input type="text" class="note-input" placeholder="Notes..." id="n_${exIndex}_${s}">
                            <button type="button" class="btn-check" id="btn_${exIndex}_${s}" onclick="completeSet(${exIndex}, ${s})">✓</button>
                        </div>
                    `;
                }

                html += `
                        </div>
                        <button type="button" class="btn-add-set" onclick="addSet(${exIndex})">+ Afegir sèrie</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Funció per afegir una sèrie extra de manera dinàmica
        function addSet(exIndex) {
            const sessionKey = document.getElementById('session-select').value;
            exerciseSetsCount[sessionKey][exIndex]++;
            renderWorkoutSession();
        }

        // Marcar sèrie com a feta i disparar temporitzador
        let currentSelectedSeconds = 60;

        function completeSet(exIndex, setNum) {
            const btn = document.getElementById(`btn_${exIndex}_${setNum}`);
            btn.classList.toggle('completed');
            
            if(btn.classList.contains('completed')) {
                startTimer(currentSelectedSeconds);
            }
        }

        // Sistema d'àudio natiu (Web Audio API)
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log('Àudio no suportat automàticament');
            }
        }

        // Temporitzador
        let timerInterval;
        let timeLeft = 60;

        function startTimer(seconds) {
            clearInterval(timerInterval);
            timeLeft = seconds;
            document.getElementById('timer-container').style.display = 'block';
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playBeep();
                    alert('⏰ Temps de descans finalitzat! A per la següent sèrie.');
                    stopTimer();
                }
            }, 1000);
        }

        function setRestTime(seconds) {
            currentSelectedSeconds = seconds;
            [60, 120, 180].forEach(s => {
                const b = document.getElementById(`btn-${s}`);
                if(b) b.classList.remove('active-time');
            });
            const activeBtn = document.getElementById(`btn-${seconds}`);
            if(activeBtn) activeBtn.classList.add('active-time');

            startTimer(seconds);
        }

        function addTime(seconds) {
            timeLeft = Math.max(0, timeLeft + seconds);
            updateTimerDisplay();
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-container').style.display = 'none';
        }

        function updateTimerDisplay() {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer-display').textContent = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        // Guardar tota la sessió a l'historial
        let historyData = JSON.parse(localStorage.getItem('gym_history')) || [];

        function saveWorkoutSession() {
            const sessionKey = document.getElementById('session-select').value;
            const sessionType = sessionKey.toUpperCase();
            const exercises = sessionData[sessionKey];
            const setsCountArr = exerciseSetsCount[sessionKey] || [3,3,3,3];
            
            let summarySets = [];
            exercises.forEach((exName, exIndex) => {
                let totalSets = setsCountArr[exIndex];
                for(let s = 1; s <= totalSets; s++) {
                    let wElem = document.getElementById(`w_${exIndex}_${s}`);
                    let rElem = document.getElementById(`r_${exIndex}_${s}`);
                    let nElem = document.getElementById(`n_${exIndex}_${s}`);
                    
                    if(wElem && rElem) {
                        let w = wElem.value;
                        let r = rElem.value;
                        let n = nElem ? nElem.value : '';
                        if(w || r) {
                            summarySets.push(`${exName} (S${s}): ${w || 0}kg x ${r || 0}reps ${n ? '['+n+']' : ''}`);
                        }
                    }
                }
            });

            if(summarySets.length === 0) {
                alert('Omple almenys una sèrie abans de desar!');
                return;
            }

            const record = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                sessionType,
                details: summarySets
            };

            historyData.unshift(record);
            localStorage.setItem('gym_history', JSON.stringify(historyData));
            updateHistoryUI();
            alert('🎉 Sessió desada correctament a l\'historial!');
            switchTab('history');
        }

        function updateHistoryUI() {
            const container = document.getElementById('history-list');
            if(historyData.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Encara no hi ha registres.</p>';
                return;
            }

            container.innerHTML = historyData.slice(0, 10).map(item => `
                <div class="history-item">
                    <strong style="color: var(--primary);">[${item.sessionType}]</strong> <span style="font-size:0.75rem; color:var(--text-muted);">${item.date}</span><br>
                    <div style="margin-top: 5px; font-size: 0.85rem; color: #cbd5e1;">
                        ${item.details.map(d => `• ${d}`).join('<br>')}
                    </div>
                </div>
            `).join('');
        }

        // Gestió de Pestanyes
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        // Inicialitzar al carregar la pàgina
        renderWorkoutSession();
        updateHistoryUI();
    </script>
</body>
</html>
